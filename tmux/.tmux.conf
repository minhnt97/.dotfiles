# Reset Prefix
unbind C-b
set -g prefix C-s
bind-key C-s send-prefix

# Reset key
unbind r
bind r source-file ~/.tmux.conf

# mappings for window spliting
bind s split-window -v -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'

# mappings for pane switching (require smart-splits.nvim)
set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @smart-splits_at_edge 'stop'

set -g @smart-splits_move_left_key  'C-h'
set -g @smart-splits_move_down_key  'C-j'
set -g @smart-splits_move_up_key    'C-k'
set -g @smart-splits_move_right_key 'C-l'

set -g @smart-splits_resize_left_key  'M-h'
set -g @smart-splits_resize_down_key  'M-j'
set -g @smart-splits_resize_up_key    'M-k'
set -g @smart-splits_resize_right_key 'M-l'

set -g @smart-splits_resize_step_size '3'

# mappings for pane switching in copy mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# disable automatic mapping of <prefix><C-l>
set -g @vim_navigator_prefix_mapping_clear_screen ""

# start window indexing at one instead of zero
set -g base-index 1

# Allows for faster key repetition
set -s escape-time 0

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Set key bindings in copy mode
set -g mode-keys vi

# Don't rename windows automatically
set -g allow-rename off

# visual notification of activity in other windows
set -g monitor-activity on
set -g visual-activity on

# Rather than constraining window size to the maximum size of any client 
# connected to the *session*, constrain window size to the maximum size of any 
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Custom status bar
set -g status on
set-option -g status-position top

# Set true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Yanking
set -g @plugin 'tmux-plugins/tmux-yank'

# Theme
set -g @plugin 'niksingh710/minimal-tmux-status'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
